import com.github.spotbugs.snom.SpotBugsTask

plugins {
    id 'java'
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.0.18'
    id 'me.champeau.jmh' version '0.7.2'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.6.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.6.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.6.2'
}

group = 'com.gildedrose'
version = '0.0.1-SNAPSHOT'

defaultTasks 'build'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
    // JUnit 5 parallel execution
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'
    systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'concurrent'

    // Let JUnit use all cores dynamically
    systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'dynamic'
    systemProperty 'junit.jupiter.execution.parallel.config.dynamic.factor', '1.0'
    jvmArgs += ["-Djava.util.concurrent.ForkJoinPool.common.parallelism=${Math.max(1, Runtime.runtime.availableProcessors())}"]
    jvmArgs += ["-Djdk.virtualThreadScheduler.parallelism=${Runtime.runtime.availableProcessors()}"]
}

checkstyle {
    toolVersion = '10.12.4'
    config = resources.text.fromFile("config/checkstyle/checkstyle.xml")
    ignoreFailures = true
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}

spotbugs {
    toolVersion = '4.8.6'
    ignoreFailures = true
}

tasks.withType(SpotBugsTask).configureEach {
    reports.create('html') { required = true }
}

// Ensure static analysis tasks run with check
check.dependsOn 'checkstyleMain', 'checkstyleTest', 'spotbugsMain', 'spotbugsTest'

tasks.register('texttest', JavaExec) {
    mainClass = "com.gildedrose.TexttestFixture"
    classpath = sourceSets.test.runtimeClasspath
    args "30"
}
